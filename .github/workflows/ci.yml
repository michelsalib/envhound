name: ci

on:
  push:
    branches: [main]
  pull_request:

# read-only: CI never writes to the repository
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows reads the registry, so the bash tracing tests are skipped there
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24]
        # the oldest Node versions engines allows run the built file too
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      # actions are pinned to a commit; Dependabot proposes updates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # bun runs the tests and the build; tests also run the built file on node,
      # as users do, and the installers pick node first
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # the zsh tests need zsh: macOS has it, Ubuntu runners may not
      - name: Install zsh
        if: runner.os == 'Linux'
        run: command -v zsh || (sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh)
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      # the tests start real processes (bash, PowerShell, npm), slow on a cold runner
      - run: bun test --coverage --timeout 30000
      - run: bun run build
      - run: node dist/envhound.js --version
      # the release files must be reproducible from the source: the same build twice
      - name: Build is deterministic
        if: runner.os == 'Linux'
        run: cp dist/envhound.js /tmp/first.js && bun run build && cmp /tmp/first.js dist/envhound.js
      # the release cross-compiles them all on Linux; each OS runs its own, and prints every hash:
      # the same on every runner means the cross-compiled ones are the native ones
      - name: Standalone binaries
        if: matrix.node == 24
        shell: bash
        run: |
          bun run build:bin
          (cd dist/bin && (sha256sum * 2>/dev/null || shasum -a 256 *))
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) bin=envhound-linux-x64 ;;
            macOS-ARM64) bin=envhound-darwin-arm64 ;;
            macOS-X64) bin=envhound-darwin-x64 ;;
            Windows-X64) bin=envhound-windows-x64.exe ;;
          esac
          dist/bin/$bin --version
          dist/bin/$bin why node
          dist/bin/$bin list > /dev/null
      - run: shellcheck install.sh scripts/update-package-repos.sh
        if: runner.os == 'Linux'
      - name: PSScriptAnalyzer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          $issues = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Warning,Error
          $issues | Format-Table -AutoSize
          if ($issues) { exit 1 }
