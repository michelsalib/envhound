name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows: no bash tracing yet, so its tests are skipped there; the rest must pass
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      # bun runs the tests and the build; tests also run the built file on node,
      # as users do, and the installers pick node first
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - run: node dist/envhound.js --version
      - run: shellcheck install.sh
        if: runner.os == 'Linux'
