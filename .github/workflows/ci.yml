name: ci

on:
  push:
    branches: [main]
  pull_request:

# read-only: CI never writes to the repository
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows reads the registry, so the bash tracing tests are skipped there
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24]
        # the oldest Node versions engines allows run the built file too
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      # actions are pinned to a commit; Dependabot proposes updates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # bun runs the tests and the build; tests also run the built file on node,
      # as users do, and the installers pick node first
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      # the tests start real processes (bash, PowerShell, npm), slow on a cold runner
      - run: bun test --coverage --timeout 30000
      - run: bun run build
      - run: node dist/envhound.js --version
      # the release files must be reproducible from the source: the same build twice
      - name: Build is deterministic
        if: runner.os == 'Linux'
        run: cp dist/envhound.js /tmp/first.js && bun run build && cmp /tmp/first.js dist/envhound.js
      - run: shellcheck install.sh
        if: runner.os == 'Linux'
      - name: PSScriptAnalyzer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          $issues = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Warning,Error
          $issues | Format-Table -AutoSize
          if ($issues) { exit 1 }
