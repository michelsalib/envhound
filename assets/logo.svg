      <polygon points="150,54 186,58 212,92 228,150 224,204 204,222 184,190 174,140 166,96" fill="#a8521a" stroke="#a8521a" stroke-width="1" stroke-linejoin="round"/>
      <polygon points="166,96 174,140 184,190 204,222 180,214 164,166 158,120" fill="#8c4214" stroke="#8c4214" stroke-width="1" stroke-linejoin="round"/>
      <polygon points="150,54 186,58 210,90 176,80" fill="#c0631f" stroke="#c0631f" stroke-width="1" stroke-linejoin="round"/>
      <polygon points="128,40 150,44 176,80 166,96 158,120 128,108" fill="#e08a3a" stroke="#e08a3a" stroke-width="1" stroke-linejoin="round"/>
      <polygon points="128,108 158,120 160,132 140,128 128,126" fill="#d07a2c" stroke="#d07a2c" stroke-width="1" stroke-linejoin="round"/>
      <polygon points="158,120 164,166 160,176 148,150 140,128 160,132" fill="#c76f26" stroke="#c76f26" stroke-width="1" stroke-linejoin="round"/>
      <polygon points="128,126 140,128 148,150 146,186 128,190" fill="#fbf1e3" stroke="#fbf1e3" stroke-width="1" stroke-linejoin="round"/>
      <polygon points="148,150 160,176 158,196 146,186" fill="#eedcc6" stroke="#eedcc6" stroke-width="1" stroke-linejoin="round"/>
      <polygon points="146,186 158,196 164,166 176,206 160,222 140,214 128,214 128,190" fill="#fbf1e3" stroke="#fbf1e3" stroke-width="1" stroke-linejoin="round"/>
      <path d="M136 112 Q150 100 166 110 Q158 126 140 120 Z" fill="#2b1d14"/>
      <circle cx="151" cy="113" r="4.6" fill="#7fd18b"/>
    </g>
  </defs>
  <rect width="256" height="256" rx="52" fill="#1b1f2a"/>
  <g transform="translate(-6.4 -10) scale(1.05)">
    <use href="#half" xlink:href="#half"/>
    <use href="#half" xlink:href="#half" transform="matrix(-1 0 0 1 256 0)"/>
    <polygon points="128,64 134,70 140,128 128,190 116,128 122,70" fill="#fbf1e3"/>
    <!-- nose -->
    <path d="M108 186 Q128 176 148 186 Q146 200 128 206 Q110 200 108 186 Z" fill="#2b1d14"/>
    <path d="M118 188 Q122 186 124 190 M132 190 Q134 186 138 188" stroke="#55443a" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  <!-- the prompt, with a blinking cursor; outlined in the background colour where it overlaps the head -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="54" font-weight="800" fill="#7fd18b" stroke="#1b1f2a" stroke-width="9" stroke-linejoin="round" paint-order="stroke">
    <text x="164" y="224">$</text>
    <text x="196" y="224">_<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1.1s" repeatCount="indefinite"/></text>
  </g>
</svg>
